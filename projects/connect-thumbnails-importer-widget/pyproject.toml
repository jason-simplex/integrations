[tool.poetry]
name = "ftrack-connect-thumbnails-importer-widget"
version = "0.0.0"
description = "ftrack Connect batch thumbnails importer widget"
authors = ["BroTiger <jason.zheng@backlight.co>"]
readme = "README.md"
packages = [
    { include = "ftrack_connect_thumbnails_importer_widget", from = "source" },
]
license = "Apache-2.0"
homepage = "https://ftrack.com"
repository = "https://github.com/jason-simplex/integrations/tree/jason/workbench/projects/connect-thumbnails-importer-widget"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">= 3.7, < 3.12"
ftrack-utils = { version = "^3.0.0", optional = true }
openpyxl = "^3.1.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
# ftrack-utils = { path = "../../libs/utils", develop = true }

[tool.poetry.extras]
ftrack-libs = ["ftrack-utils"]

[tool.black]
line-length = 79
skip-string-normalization = true
